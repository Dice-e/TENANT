spring.application.name=tenant

# In-memory H2 database. All data is lost when the app stops.
spring.datasource.url=jdbc:h2:mem:tenantdb

# Hibernate creates the tables from the entities.
spring.jpa.hibernate.ddl-auto=update

# Print the SQL in the console so we can see what JPA does.
spring.jpa.show-sql=true

# The H2 console is intentionally not enabled (see PROJECT_ARCHITECTURE.md).
